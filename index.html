"さればこそ","meaning":"思ったとおりだ","story":"またのひ、狐来たりて、「さればこそ。","match":"さればこそ","episode":"熊の冬支度","ep":22},{"id":325,"word":"よのつねなり","meaning":"ありきたりだ・月並みだ","story":"熊、「よのつねなる備へとは違ふぞ」と得意になりたり。","match":"よのつねな","episode":"熊の冬支度","ep":22},{"id":326,"word":"ただならず","meaning":"普通ではない","story":"狐、「まだ足らぬか」と言へば、熊、「ただならぬ大雪の降るやもしれぬ」と答ふ。","match":"ただなら","episode":"熊の冬支度","ep":22},{"id":327,"word":"ものもおぼえず","meaning":"呆然としている","story":"されど木の実崩れ落ち、熊、ものもおぼえず立ち尽くしたり。","match":"ものもおぼえず","episode":"熊の冬支度","ep":22},{"id":328,"word":"ひとやりならず","meaning":"他人のせいでなく自分の心から","story":"熊、初めは惜しみけれど、やがて「ひとやりならず集めし物なれば、分くるも我が心にてせむ」と言ひ、皆に分け与へたり。","match":"ひとやりならず","episode":"熊の冬支度","ep":22},{"id":329,"word":"またのひ","meaning":"翌日","story":"またのひ、狐来たりて、「さればこそ。","match":"またのひ","episode":"熊の冬支度","ep":22},{"id":330,"word":"～あへず","meaning":"最後まで～しきれない","story":"木の実を動かさむとしても、重くて運びあへず。","match":"運びあへず","episode":"熊の冬支度","ep":22}];
const $=id=>document.getElementById(id);
const STORE='kobun330-buzzer-save-v1';
const KEYS={a:[0,0],s:[0,1],d:[0,2],f:[0,3],h:[1,0],j:[1,1],k:[1,2],l:[1,3]};
let state=null,deadline=0,tickId=null,nextId=null,phase='start',choiceButtons=[];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a};
const clean=s=>s.replace(/（[^）]*）/g,'').replace(/\s+/g,'').trim();
function optionsFor(q){let distract=shuffle(DATA.filter(x=>x.id!==q.id && clean(x.meaning)!==clean(q.meaning) && x.ep===q.ep).map(x=>x.meaning));let seen=new Set([clean(q.meaning)]),arr=[];for(let x of distract){if(!seen.has(clean(x))){seen.add(clean(x));arr.push(x)}if(arr.length===3)break}if(arr.length<3){for(let x of shuffle(DATA.filter(x=>x.id!==q.id).map(x=>x.meaning))){if(!seen.has(clean(x))){seen.add(clean(x));arr.push(x)}if(arr.length===3)break}}let answer=shuffle([q.meaning,...arr]);return {answer,correct:answer.indexOf(q.meaning)}}
function save(){if(state && state.mode===330 && phase==='question')localStorage.setItem(STORE,JSON.stringify(state))}
function clearTimers(){clearInterval(tickId);clearTimeout(nextId);tickId=nextId=null}
function show(id){for(let x of ['start','game','end'])$(x).classList.toggle('hide',x!==id)}
function begin(mode){clearTimers();localStorage.removeItem(STORE);state={mode,seconds:Number(document.querySelector('input[name="seconds"]:checked').value),ids:shuffle(DATA.map(x=>x.id)).slice(0,mode),index:0,scores:[0,0],corrects:[0,0],miss:[false,false],opts:null};show('game');question()}
function question(){clearTimers();if(state.index>=state.ids.length){finish();return}phase='question';state.miss=[false,false];const q=DATA[state.ids[state.index]-1];state.opts=optionsFor(q);$('progress').textContent=`第 ${state.index+1} / ${state.ids.length} 問`;$('p1score').textContent=state.scores[0];$('p2score').textContent=state.scores[1];$('p1correct').textContent=`正解 ${state.corrects[0]}`;$('p2correct').textContent=`正解 ${state.corrects[1]}`;$('source').textContent=`第${q.ep}話「${q.episode}」 ／ 単語 No.${q.id}：${q.word}`;
const text=q.story,hit=q.match,pos=hit?text.indexOf(hit):-1;$('story').replaceChildren();if(pos>=0){$('story').append(document.createTextNode(text.slice(0,pos)));const em=document.createElement('span');em.className='target';em.textContent=text.slice(pos,pos+hit.length);$('story').append(em,document.createTextNode(text.slice(pos+hit.length)))}else{$('story').textContent=text+'【'+q.word+'】'}
$('choices').replaceChildren();choiceButtons=state.opts.answer.map((a,i)=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<b>${i+1}.</b> `;b.append(document.createTextNode(a));const keys=document.createElement('span');keys.className='keys';keys.textContent=`${'ASDF'[i]} / ${'HJKL'[i]}`;b.append(keys);b.onclick=()=>{};b.title='二人対戦はキーボードで回答';$('choices').append(b);return b});$('status').textContent='どちらが先に正解する？';$('explain').classList.add('hide');$('p1state').textContent='';$('p2state').textContent='';deadline=performance.now()+(state.seconds||5)*1000;updateTimer();tickId=setInterval(updateTimer,50);save()}
function updateTimer(){if(phase!=='question')return;let left=Math.max(0,(deadline-performance.now())/1000);$('timer').textContent=left.toFixed(1);$('timer').classList.toggle('low',left<=1);$('fill').style.width=(left/(state.seconds||5)*100)+'%';$('fill').classList.toggle('low',left<=1);if(left<=0)reveal('時間切れ！')}
function answer(player,choice){if(phase!=='question'||state.miss[player])return;if(performance.now()>=deadline){reveal('時間切れ！');return}if(choice===state.opts.correct){state.scores[player]+=10;state.corrects[player]++;reveal(`プレイヤー${player+1} 正解！ ＋10点`,choice)}else{state.miss[player]=true;$('p'+(player+1)+'state').textContent='回答済み';$('status').textContent=`プレイヤー${player+1}は不正解。相手はまだ回答できます。`;if(state.miss.every(Boolean))reveal('両者とも不正解！')}}
function reveal(msg,chosen=-1){if(phase!=='question')return;phase='reveal';clearInterval(tickId);$('status').textContent=msg;choiceButtons.forEach((b,i)=>{b.disabled=true;if(i===state.opts.correct)b.classList.add('correct');else if(i===chosen)b.classList.add('wrong')});const q=DATA[state.ids[state.index]-1];$('explain').classList.remove('hide');$('explain').replaceChildren();const strong=document.createElement('b');strong.textContent=`正解：${q.meaning}`;const note=document.createElement('div');note.textContent=`${q.word} ／ 第${q.ep}話「${q.episode}」`;const link=document.createElement('a');link.href='https://nekomebito.github.io/kobun330/';link.target='_blank';link.rel='noopener';link.textContent='元の動物説話集で復習';$('explain').append(strong,note,link);state.index++;if(state.mode===330)localStorage.setItem(STORE,JSON.stringify(state));nextId=setTimeout(question,1500)}
function finish(){phase='end';clearTimers();localStorage.removeItem(STORE);show('end');$('progress').textContent='対戦終了';const [a,b]=state.scores;const win=a===b?'引き分け！':`プレイヤー${a>b?1:2}の勝利！`;$('result').replaceChildren();const h=document.createElement('h2');h.textContent=win;const p=document.createElement('p');p.textContent=`プレイヤー1：${a}点（${state.corrects[0]}問正解） ／ プレイヤー2：${b}点（${state.corrects[1]}問正解）`;$('result').append(h,p)}
function home(){clearTimers();phase='start';state=null;show('start');$('progress').textContent='';$('resumeBtn').classList.toggle('hide',!localStorage.getItem(STORE))}
$('startBtn').onclick=()=>begin(Number(document.querySelector('input[name="mode"]:checked').value));$('resumeBtn').onclick=()=>{try{state=JSON.parse(localStorage.getItem(STORE));if(!state||!Array.isArray(state.ids)||state.mode!==330)throw Error('invalid');show('game');question()}catch{localStorage.removeItem(STORE);home()}};$('pauseBtn').onclick=()=>{if(phase==='question'){save();home()}else if(phase==='reveal'){clearTimers();localStorage.setItem(STORE,JSON.stringify(state));home()}};$('quitBtn').onclick=()=>{if(state?.mode===330 && phase==='question')save();home()};$('againBtn').onclick=home;
window.addEventListener('keydown',e=>{if(e.repeat||e.altKey||e.ctrlKey||e.metaKey||e.isComposing)return;const k=e.key.toLowerCase();if(!(k in KEYS))return;if(phase!=='question')return;e.preventDefault();const [p,c]=KEYS[k];answer(p,c)});window.addEventListener('beforeunload',()=>{if(phase==='question')save()});home();
</script></body></html>
